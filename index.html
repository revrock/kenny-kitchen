<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap');
  :root{--sky:#9BD9EC;--sky2:#BDE9F2;--grass:#A9D96C;--card:#FFFDF6;--bbq:#E8623C;--bbq-deep:#C94A28;--char:#3E2E26;--sun:#FBC23C;--pink:#F58AA0;--leaf:#59A23A;--line:#EFE2C8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--char);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 42%,#CDE8A0 70%,var(--grass) 100%);background-attachment:fixed;min-height:100vh;padding-bottom:40px;overflow-x:hidden;}
  .sun{position:fixed;top:14px;right:18px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#FFE07A,var(--sun));box-shadow:0 0 34px rgba(251,194,60,.7);z-index:0;animation:spin 40s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .wrap{position:relative;z-index:2;max-width:600px;margin:0 auto;padding:16px 14px 0;}
  h1{font-family:'Fredoka',sans-serif;font-weight:700;text-align:center;color:#fff;font-size:25px;line-height:1.05;margin:8px 0 8px;text-shadow:0 3px 0 var(--bbq-deep),0 5px 8px rgba(0,0,0,.2);}
  .picker{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
  .chip{flex:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;background:var(--card);border:2px solid var(--char);border-radius:14px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(62,46,38,.18);white-space:nowrap;}
  .chip.active{background:var(--bbq);color:#fff;}
  .paws{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
  .paw{width:17px;height:17px;opacity:.4;transition:all .25s ease;filter:grayscale(.5);}
  .paw.on{opacity:1;filter:none;transform:scale(1.15);}
  .scene{background:linear-gradient(180deg,#FFFDF6,#FBF1DE);border:3px solid var(--char);border-radius:18px;box-shadow:0 5px 0 rgba(62,46,38,.16);margin-bottom:12px;overflow:hidden;cursor:pointer;}
  .scene svg{display:block;width:100%;height:auto;}
  .scene svg *{transform-box:fill-box;transform-origin:center;}
  .scene.boop{animation:sboop .5s ease;}
  @keyframes sboop{0%,100%{transform:rotate(0);}30%{transform:rotate(-1.2deg) scale(1.01);}70%{transform:rotate(1.2deg) scale(1.01);}}
  .arm{transform-box:fill-box;transform-origin:80% 8%;}
  .arm-l{transform-box:fill-box;transform-origin:20% 8%;}
  .scene svg .arm{transform-origin:80% 8%;}
  .scene svg .arm-l{transform-origin:20% 8%;}
  .scene svg .flick,.scene svg .flick2{transform-origin:bottom center;}
  .scene svg .needle{transform-origin:50% 90%;}
  .kbody{animation:kbreathe 3s ease-in-out infinite;}
  @keyframes kbreathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
  .act-whisk{animation:awhisk .32s ease-in-out infinite;}
  @keyframes awhisk{0%,100%{transform:rotate(-9deg);}50%{transform:rotate(9deg);}}
  .act-stir{animation:astir 1.1s ease-in-out infinite;}
  @keyframes astir{0%,100%{transform:rotate(-11deg);}50%{transform:rotate(11deg);}}
  .act-chop{animation:achop .8s ease-in-out infinite;}
  @keyframes achop{0%,100%{transform:translateY(-11px) rotate(-3deg);}45%,55%{transform:translateY(2px) rotate(5deg);}}
  .act-slice{animation:aslice 1.5s ease-in-out infinite;}
  @keyframes aslice{0%,100%{transform:translateX(8px) rotate(3deg);}50%{transform:translateX(-14px) rotate(-4deg);}}
  .act-place{animation:aplace 2.2s ease-in-out infinite;}
  @keyframes aplace{0%,100%{transform:translateY(-7px) rotate(-3deg);}50%{transform:translateY(4px) rotate(3deg);}}
  .act-cheer{animation:acheer 1s ease-in-out infinite;}
  @keyframes acheer{0%,100%{transform:rotate(3deg) translateY(0);}50%{transform:rotate(-12deg) translateY(-5px);}}
  .act-cheerL{animation:acheerL 1s ease-in-out infinite;}
  @keyframes acheerL{0%,100%{transform:rotate(-3deg) translateY(0);}50%{transform:rotate(12deg) translateY(-5px);}}
  .flick{animation:flick .6s ease-in-out infinite;transform-origin:bottom center;}
  .flick2{animation:flick .32s ease-in-out infinite;transform-origin:bottom center;}
  @keyframes flick{0%,100%{transform:scaleY(.88) scaleX(1);opacity:.85;}50%{transform:scaleY(1.16) scaleX(.94);opacity:1;}}
  .rise{animation:srise 2.6s ease-in infinite;}
  @keyframes srise{0%{transform:translateY(6px) scale(.8);opacity:0;}25%{opacity:.75;}100%{transform:translateY(-38px) scale(1.3);opacity:0;}}
  .sbob{animation:sbob 2s ease-in-out infinite;}
  @keyframes sbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .slosh{animation:slosh 1.6s ease-in-out infinite;}
  @keyframes slosh{0%,100%{transform:scaleX(1) rotate(0);}50%{transform:scaleX(1.05) rotate(3deg);}}
  .spark{animation:sspark .9s ease-out infinite;}
  @keyframes sspark{0%{transform:translateY(2px) scale(.5);opacity:0;}30%{opacity:1;transform:translateY(-8px) scale(1);}100%{transform:translateY(-18px) scale(.4);opacity:0;}}
  .bub{animation:sbub 2.3s ease-in infinite;}
  @keyframes sbub{0%{transform:translateY(0) scale(.6);opacity:0;}30%{opacity:.8;}100%{transform:translateY(-22px) scale(1);opacity:0;}}
  .needle{animation:sneedle 2.6s ease-out infinite;transform-origin:50% 90%;}
  @keyframes sneedle{0%{transform:rotate(-58deg);}70%{transform:rotate(30deg);}100%{transform:rotate(26deg);}}
  .glow{animation:sglow 1.2s ease-in-out infinite;}
  @keyframes sglow{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .mark{opacity:0;animation:smark .5s ease forwards;}
  @keyframes smark{to{opacity:.85;}}
  .drop{animation:sdrop 2s ease-in infinite;}
  @keyframes sdrop{0%{transform:translateY(-16px);opacity:0;}20%{opacity:1;}80%{transform:translateY(14px);opacity:1;}100%{opacity:0;}}
  .slidein{opacity:0;animation:sslide .6s ease-out forwards;}
  @keyframes sslide{0%{transform:translateX(-24px) rotate(0);opacity:0;}100%{transform:translateX(0) rotate(var(--r,0deg));opacity:1;}}
  .bubble-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .bubble{position:relative;background:#fff;border:3px solid var(--char);border-radius:16px;padding:10px 13px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:14.5px;line-height:1.3;flex:1;box-shadow:0 4px 0 rgba(62,46,38,.15);}
  .boop{flex:none;font-family:'Fredoka',sans-serif;font-size:14px;color:#fff;background:var(--leaf);border:none;border-radius:20px;padding:8px 12px;cursor:pointer;font-weight:500;box-shadow:0 3px 0 #3f7a28;}
  .card{background:var(--card);border:3px solid var(--char);border-radius:20px;padding:16px;box-shadow:0 6px 0 rgba(62,46,38,.18);margin-bottom:14px;}
  .stage-tag{font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bbq);}
  .stage-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:21px;line-height:1.08;margin:2px 0 10px;}
  .real{background:#FFF3DC;border-radius:12px;padding:12px 13px;font-size:15px;line-height:1.5;border:2px dashed #E7C778;}
  .real b{color:var(--bbq-deep);}
  .dur{display:inline-block;margin-top:10px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:13px;color:#7a6a5c;background:#F1E7D2;border-radius:20px;padding:4px 12px;}
  .meter-wrap{margin:12px 0 2px;}
  .meter-lbl{font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;color:var(--char);display:flex;justify-content:space-between;margin-bottom:4px;}
  .meter{height:15px;background:#F3D9C0;border:2px solid var(--char);border-radius:20px;overflow:hidden;}
  .meter-fill{height:100%;width:0%;border-radius:20px;background:linear-gradient(90deg,#E27A5A,#B54127);transition:width .5s ease;}
  .timer{display:inline-flex;align-items:center;gap:8px;margin-top:11px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;background:#fff;border:2px solid var(--bbq);color:var(--bbq-deep);border-radius:12px;padding:7px 14px;cursor:pointer;}
  .timer.running{background:var(--bbq);color:#fff;}
  .timer.done{background:var(--leaf);border-color:var(--leaf);color:#fff;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.6;}}
  .sizzle-btn{margin-top:11px;margin-left:8px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;background:var(--sun);border:2px solid var(--char);border-radius:12px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 #d89e1e;}
  .nav{display:flex;gap:10px;margin-bottom:10px;}
  .btn{flex:1;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;border:3px solid var(--char);border-radius:16px;padding:13px;cursor:pointer;box-shadow:0 4px 0 rgba(62,46,38,.25);transition:transform .08s ease;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(62,46,38,.25);}
  .btn.back{background:#fff;color:var(--char);flex:0 0 76px;}
  .btn.next{background:var(--bbq);color:#fff;}
  .btn:disabled{opacity:.4;cursor:default;}
  .confetti{position:fixed;top:-30px;font-size:26px;z-index:50;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9;}}
  .celebrate{animation:celebshake .5s ease 2;}
  @keyframes celebshake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px) rotate(-.6deg);}60%{transform:translateX(6px) rotate(.6deg);}}
  .footer{text-align:center;font-family:'Fredoka',sans-serif;font-size:12px;color:#5f7a3a;padding:2px 10px 24px;font-weight:500;}

  .pickbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:3px solid var(--char);border-radius:18px;padding:10px 12px 10px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 4px 0 rgba(62,46,38,.18);font:inherit;color:var(--char);text-align:left;}
  .pickbar:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(62,46,38,.18);}
  .pb-emoji{font-size:30px;line-height:1;flex:none;}
  .pb-txt{flex:1;min-width:0;}
  .pb-lbl{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bbq);}
  .pb-name{display:block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;line-height:1.15;}
  .pb-go{flex:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:#fff;background:var(--bbq);border-radius:12px;padding:8px 12px;}
  .menu{position:fixed;inset:0;z-index:60;display:none;}
  .menu.open{display:block;}
  .menu-bg{position:absolute;inset:0;background:rgba(62,46,38,.45);}
  .menu-sheet{position:absolute;left:0;right:0;bottom:0;top:max(28px,env(safe-area-inset-top));max-width:600px;margin:0 auto;background:#FFFBF2;border:3px solid var(--char);border-bottom:0;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:sheetup .25s ease-out;}
  @keyframes sheetup{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
  .menu-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;}
  .menu-head h2{flex:1;margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;}
  .menu-x{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--char);background:#fff;font-size:18px;cursor:pointer;color:var(--char);}
  .menu-search{margin:0 16px 8px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:16px;background:#fff;color:var(--char);}
  .menu-search:focus{outline:none;border-color:var(--bbq);}
  .menu-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + env(safe-area-inset-bottom));}
  .grp{font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a7a6a;margin:14px 2px 8px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .rc{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:92px;background:#fff;border:2px solid var(--char);border-radius:16px;padding:12px;cursor:pointer;font:inherit;color:var(--char);text-align:left;box-shadow:0 3px 0 rgba(62,46,38,.15);}
  .rc:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(62,46,38,.15);}
  .rc.on{background:var(--bbq);color:#fff;border-color:var(--bbq-deep);}
  .rc-e{font-size:28px;line-height:1;}
  .rc-n{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;line-height:1.15;}
  .rc-s{font-size:12px;opacity:.7;margin-top:auto;}
  .empty{text-align:center;color:#8a7a6a;padding:30px 10px;font-family:'Fredoka',sans-serif;}
  body.locked{overflow:hidden;}

  /* ---------- motion system ---------- */
  .scene svg .kmove,.scene svg .kimg,.scene svg .kin{transform-box:fill-box;transform-origin:50% 100%;}
  .scene svg .react,.scene svg .jar,.scene svg .lidbob,.scene svg .trg{transform-box:fill-box;transform-origin:50% 100%;}
  .scene svg .spin,.scene svg .swirl{transform-box:fill-box;transform-origin:50% 50%;}
  .sc{--P:3s;--E:cubic-bezier(.45,0,.55,1);}
  .p-stir{--P:1.25s}.p-whisk{--P:.38s}.p-season{--P:.62s}.p-chop{--P:.82s}.p-slice{--P:1.4s}.p-tongs{--P:1.7s}.p-dial{--P:1.5s}.p-blend{--P:.5s}.p-lid{--P:2.2s}.p-peek{--P:2.6s}.p-wait{--P:3.4s}.p-serve{--P:.95s}.p-cheer{--P:.62s}.p-idle{--P:3s}
  /* entrance: Kenny settles in, props pop on in a stagger */
  .scene svg .kin{animation:kin .55s cubic-bezier(.2,1.25,.35,1) both;}
  @keyframes kin{0%{opacity:0;transform:translateY(10px) scale(.95,.97);}55%{opacity:1;transform:translateY(-3px) scale(1.01,1.02);}80%{transform:translateY(1px) scale(1.005,.99);}100%{transform:none;}}
  .scene svg .pin{animation:pin .5s cubic-bezier(.2,1.3,.4,1) both;transform-box:fill-box;transform-origin:50% 100%;}
  @keyframes pin{0%{opacity:0;transform:translateY(8px) scale(.9);}70%{opacity:1;transform:translateY(-1.5px) scale(1.02);}100%{transform:none;}}
  /* breathing with squash and stretch */
  .scene svg .kimg{animation:kb 3.2s var(--E) infinite;}
  @keyframes kb{0%,100%{transform:scale(1,1);}50%{transform:scale(.996,1.012);}}
  /* actions, with wind-up and follow-through */
  .scene svg .m-stir{animation:m-stir var(--P) var(--E) infinite;}
  @keyframes m-stir{0%,100%{transform:rotate(-1.8deg) translateX(-1.2px);}50%{transform:rotate(1.8deg) translateX(1.2px);}}
  .scene svg .m-whisk{animation:m-whisk var(--P) var(--E) infinite;}
  @keyframes m-whisk{0%,100%{transform:rotate(-1deg) translateY(0);}50%{transform:rotate(1deg) translateY(-.8px);}}
  .scene svg .m-season{animation:m-season var(--P) infinite;}
  @keyframes m-season{0%{transform:rotate(0);animation-timing-function:cubic-bezier(.3,0,.7,1);}30%{transform:rotate(-1.6deg) translateY(-1.5px);animation-timing-function:cubic-bezier(.6,0,1,1);}45%{transform:rotate(1deg) translateY(1px);}70%,100%{transform:rotate(0);}}
  .scene svg .m-chop{animation:m-chop var(--P) infinite;}
  @keyframes m-chop{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.3,0,.6,1);}38%{transform:translateY(-3.5px) rotate(-.7deg);animation-timing-function:cubic-bezier(.7,0,1,1);}50%{transform:translateY(3px) rotate(.5deg);animation-timing-function:ease-out;}62%{transform:translateY(1.2px);}100%{transform:translateY(0);}}
  .scene svg .m-slice{animation:m-slice var(--P) var(--E) infinite;}
  @keyframes m-slice{0%,100%{transform:translateX(-3px) rotate(.6deg);}50%{transform:translateX(3px) rotate(-.6deg);}}
  .scene svg .m-tongs{animation:m-tongs var(--P) infinite;}
  @keyframes m-tongs{0%{transform:translateY(0);animation-timing-function:var(--E);}40%{transform:translateY(-2.5px) rotate(-1deg);animation-timing-function:cubic-bezier(.7,0,1,1);}55%{transform:translateY(1.5px) rotate(.8deg);animation-timing-function:ease-out;}70%{transform:translateY(0) rotate(0);}100%{transform:translateY(0);}}
  .scene svg .m-dial{animation:m-dial var(--P) var(--E) infinite;}
  @keyframes m-dial{0%,100%{transform:rotate(-1.4deg);}50%{transform:rotate(1.2deg) translateY(-1px);}}
  .scene svg .m-blend{animation:m-blend var(--P) var(--E) infinite;}
  @keyframes m-blend{0%,100%{transform:translateY(0);}50%{transform:translateY(1.8px);}}
  .scene svg .m-lid{animation:m-lid var(--P) var(--E) infinite;}
  @keyframes m-lid{0%,100%{transform:rotate(0) translateY(0);}40%{transform:rotate(-1.5deg) translateY(-2.5px);}60%{transform:rotate(-1.2deg) translateY(-2px);}}
  .scene svg .m-peek{animation:m-peek var(--P) var(--E) infinite;}
  @keyframes m-peek{0%,100%{transform:rotate(0);}35%,65%{transform:rotate(-2.8deg) translateX(-1px);}}
  .scene svg .m-wait{animation:m-wait var(--P) var(--E) infinite;}
  @keyframes m-wait{0%,100%{transform:rotate(-.6deg);}50%{transform:rotate(.6deg);}}
  .scene svg .m-serve{animation:m-hop var(--P) infinite;}
  .scene svg .m-cheer{animation:m-hop2 var(--P) infinite;}
  @keyframes m-hop{0%{transform:translateY(0) scale(1.02,.98);animation-timing-function:cubic-bezier(.2,.6,.4,1);}40%{transform:translateY(-5px) scale(.99,1.02);animation-timing-function:cubic-bezier(.6,0,.8,.4);}80%{transform:translateY(0) scale(1.025,.975);}100%{transform:translateY(0) scale(1.02,.98);}}
  @keyframes m-hop2{0%{transform:translateY(0) scale(1.03,.96);animation-timing-function:cubic-bezier(.2,.6,.4,1);}45%{transform:translateY(-10px) scale(.98,1.03);animation-timing-function:cubic-bezier(.6,0,.8,.4);}85%{transform:translateY(0) scale(1.04,.95);}100%{transform:translateY(0) scale(1.03,.96);}}
  /* props reacting in time with Kenny */
  .p-stir .react{animation:r-stir var(--P) var(--E) infinite;}
  @keyframes r-stir{0%,100%{transform:skewX(-2deg);}50%{transform:skewX(2deg);}}
  .p-stir .swirl{animation:r-swirl calc(var(--P)*2) linear infinite;}
  @keyframes r-swirl{0%{transform:translateX(-1.5px);}25%{transform:translateY(-.6px);}50%{transform:translateX(1.5px);}75%{transform:translateY(.6px);}100%{transform:translateX(-1.5px);}}
  .p-whisk .react{animation:r-jig var(--P) var(--E) infinite;}
  @keyframes r-jig{0%,100%{transform:translateX(-.6px);}50%{transform:translateX(.6px);}}
  .p-chop .react{animation:r-thud var(--P) infinite;}
  @keyframes r-thud{0%,48%{transform:scale(1,1);}52%{transform:scale(1.02,.94);}62%{transform:scale(.99,1.03);}75%,100%{transform:scale(1,1);}}
  .rbit{opacity:0;}
  .p-chop .rbit{animation:r-bit var(--P) infinite;}
  @keyframes r-bit{0%,48%{opacity:0;transform:translate(0,0);}52%{opacity:1;}70%{opacity:1;transform:translate(var(--bx,3px),-9px);}90%,100%{opacity:0;transform:translate(calc(var(--bx,3px)*1.6),0);}}
  .rbit:nth-child(odd){--bx:-4px;}
  .p-tongs .react{animation:r-flip var(--P) infinite;}
  @keyframes r-flip{0%,50%{transform:scale(1,1) translateY(0);}56%{transform:scale(1.04,.55) translateY(0);}64%{transform:scale(.97,1.12) translateY(-2px);}74%,100%{transform:scale(1,1) translateY(0);}}
  .rspark{opacity:0;}
  .p-tongs .rspark{animation:r-spark var(--P) infinite;}
  @keyframes r-spark{0%,52%{opacity:0;transform:translate(0,0) scale(.4);}58%{opacity:1;transform:translate(0,-6px) scale(1);}80%{opacity:0;transform:translate(var(--bx,4px),-16px) scale(.3);}100%{opacity:0;}}
  .rspark:nth-child(odd){--bx:-5px;}

  st("Cozy Under the Lid","Tuck it in, lid on. Low and slow makes it soooo tender.","Braise covered at <b>300&#176;F</b> ~3&#8211;4 hr until shreddable.",70,ACT.braise(CHILI),{dur:"~3\u20134 hr",timer:2700,timerLbl:"Braise"}),
  st("Floof That Beef","Two forks, big pulls. It falls apart like magic!","Shred the beef, fold in the juices.",88,ACT.slice(MEAT),{dur:"10 min"}),
  st("Taco Victory!","We waited, we won. Pile 'em high!","Warm tortillas, add onion, cilantro, lime.",100,ACT.serve('taco'),{dur:"Feast!"})
 ]},
 {id:"guac",name:"🥑 Guacamole",meter:"🥑 Guac Meter",steps:[
  st("Tiny Chop Party","Little dice, little dice. Careful paws!","Finely dice <b>&#189; onion</b>, <b>2 jalape&#241;os</b>, <b>&#189; cup cilantro</b>.",10,ACT.chop(ONION),{dur:"5 min"}),

 {id:"quesabirria",name:"🌮 Quesabirria",meter:"🧀 Birria Meter",steps:[

 {id:"carnitas",name:"🌮 Carnitas",meter:"🐷 Carnitas Meter",steps:[
  st("Piggy Gets Fancy","Rub it all over. Mr. Pork is getting dressed up.","Rub <b>4 lb pork shoulder</b> with salt, cumin, chili powder, oregano.",0,ACT.season(PORK),{dur:"2 min"}),
  st("Slow Piggy Nap","Low and slow. The pork is dreaming of tacos.","Smoke <b>250&#176;F</b> ~4 hr to ~165&#176;F.",30,ACT.smokewait(PORK),{dur:"~4 hr",timer:2700,timerLbl:"Smoke"}),

 {id:"chicken",name:"🍗 Pulled Chicken",meter:"🍗 Chicken Meter",steps:[
  st("Two-Flavor Chicken","One sweet, one spicy. Can't decide? Do BOTH!","Split <b>2 lb breast</b>: <b>Peach</b> on one, <b>Holy Voodoo</b> on the other.",0,ACT.season(CHK),{dur:"5 min"}),
  st("Cluck & Smoke","Cherry smoke, work your magic. Bawk bawk!","Smoke <b>275&#176;F</b> with cherry until <b>165&#176;F</b>, ~1&#8211;1.5 hr.",45,ACT.smokewait(CHK),{dur:"~1\u20131.5 hr",timer:2700,timerLbl:"Smoke"}),

 {id:"mac",name:"🧀 Smoked Mac",meter:"🧀 Mac Meter",steps:[
  st("Noodle Splash","Bubble bubble, noodle party in the pot!","Boil <b>1 lb elbows</b> to 2 min shy of al dente. Drain.",10,ACT.boil(CHEESE),{dur:"~8 min",timer:420,timerLbl:"Boil"}),
  st("Cheese Waterfall","Stir stir stir... hello, cheesy river!","Butter + flour roux, whisk in <b>4 cups milk</b>, then melt in <b>cheddar, jack, cream cheese</b>.",40,ACT.stir(CHEESE),{dur:"~10 min"}),
  st("Crunchy Hat","A buttery crumb hat for the mac. Very stylish.","Toss <b>1 cup panko</b> with melted butter; scatter on top.",55,ACT.season(CHEESE),{dur:"2 min"}),

  st("Cheese Pull!","Scoop it up and watch that cheeeeese stretch!","Rest 10 min, then serve.",100,ACT.serve('bowl',CHEESE),{dur:"Serve!"})
 ]},
 {id:"shortribs",name:"🍷 Short Ribs",meter:"🍷 Braise Meter",steps:[
  st("Fancy Seasoning","*puts on tiny chef hat* Salt and pepper, oui oui.","Season <b>6 English-cut ribs</b> with salt &amp; pepper. Rest.",0,ACT.season(MEAT),{dur:"1 hr / overnight"}),
  st("The Big Brown","Ssss! A deep dark crust. Very fancy, very tasty.","Sear all sides deeply in the Dutch oven, in batches.",20,ACT.flip(MEAT),{dur:"~15 min",sizzle:true}),
  st("Simmer the Sauce","Veggies in, wine in, bubble it down. Ooh la la!","Cook mirepoix + tomato paste, add <b>1 bottle red wine</b>, reduce by half.",40,ACT.stir(CHILI),{dur:"~20 min"}),
  st("The Long Cozy","Lid on, low heat, big patience. Worth every minute.","Add stock two-thirds up + herbs. Braise <b>325&#176;F</b> ~3.5 hr till fork-tender.",70,ACT.braise(CHILI),{dur:"~3.5 hr",timer:2700,timerLbl:"Braise"}),
  st("Cloud Potatoes","Whip 'em fluffy! Little potato clouds. Boop!","Boil <b>russets</b>, rice, fold in warm butter + milk. Keep loose.",82,ACT.boil(POTATO),{dur:"~25 min",timer:1080,timerLbl:"Boil"}),
  st("Shiny Sauce","Simmer until it's glossy. Sparkle sparkle!","Strain, defat, simmer to a glossy nappe. Season.",92,ACT.stir(CHILI),{dur:"~15 min"}),
  st("Bone Appetit!","Rib on the cloud, sauce on top. Fancy feast time!","Rib over pur&#233;e, sauce spooned over, gremolata on top.",100,ACT.serve('plate',MEAT),{dur:"Impress!"})
 ]},
 {id:"potatoes",name:"🥔 Baked Potatoes",meter:"🥔 Spud Meter",steps:[
  st("Spud Spa Day","Oil rub and a salty coat. Treat yourself, potato.","Scrub &amp; dry <b>russets</b>, poke holes, rub with <b>oil</b> and lots of <b>salt</b>.",5,ACT.season(POTATO),{dur:"5 min"}),
  st("Rise and Shine, Grill","Wakey wakey, grill! We've got spuds to bake.","Traeger to <b>400&#176;F</b>.",15,ACT.fireup(),{dur:"~10 min"}),
  st("Crispy Skin Bake","No foil! Let that skin get crispy and happy.","Straight on the grate ~1 hr until a probe slides in easy (~205&#176;F).",80,ACT.smokewait(POTATO),{dur:"~1 hr",timer:3600,timerLbl:"Bake"}),
  st("Load the Spud","Butter, cheese, all the things! Go wild.","Rest 5 min, cut a cross, fluff, and load your toppings.",100,ACT.serve('plate',POTATO),{dur:"Dig in!"})
 ]},
 {id:"rice",name:"🍚 Cilantro Lime Rice",meter:"🍚 Rice Meter",steps:[
  st("Rinse-a-Roo","Rinse till it's clear. Splish, splash, sparkle!","Rinse <b>1 cup rice</b> under cold water until it runs mostly clear.",10,ACT.stir(RICE),{dur:"2 min"}),
  st("No Peeking!","Lid on, no peeking! The rice is shy while it cooks.","Boil with <b>1.5 cups water or broth</b>, oil, salt. Cover on low 15 min, then rest 5.",60,ACT.boil(RICE),{dur:"~20 min",timer:900,timerLbl:"Simmer"}),
  st("Fluff & Zip","Fluff it up, then zippy lime and cilantro. Yum!","Fluff with a fork, stir in <b>juice of 1 lime</b> and <b>&#8531; cup cilantro</b>. Salt to taste.",90,ACT.stir(RICE),{dur:"2 min"}),
  st("Comfy Base","The perfect fluffy bed for your asada. Tuck it in!","Spoon it into bowls as the bed for your asada.",100,ACT.serve('bowl',RICE),{dur:"Serve!"})
 ]},
 {id:"beans",name:"🫘 Refried Beans",meter:"🫘 Bean Meter",steps:[
  st("Bean There","Into the warm pot! Hi, beans. Missed you.","Melt butter, add <b>1 can refried beans</b>, <b>&#189; tsp cumin</b>, <b>&#188; tsp garlic powder</b>.",20,ACT.stir(BEANS),{dur:"3 min"}),
  st("Smooth Move","A splash to loosen 'em up. Creamy, not cakey!","Stir in a splash of milk or water until creamy and loose.",55,ACT.stir(BEANS),{dur:"3 min"}),
  st("Cheese, Please","Melt in the cheese. Stir stir... gooey!","Stir in <b>&#189; cup shredded cheese</b> until melted. Salt to taste.",85,ACT.stir(CHEESE),{dur:"2 min"}),
  st("Cozy & Ready","Extra cheese on top, keep 'em toasty. Perfect.","Top with a little extra cheese and keep warm.",100,ACT.serve('bowl',BEANS),{dur:"Ready!"})
 ]},
 {id:"pico",name:"🍅 Pico de Gallo",meter:"🍅 Pico Meter",steps:[
  st("Confetti Chop","Chop everything tiny. It's like veggie confetti!","Dice <b>4 romas</b> (seeded), <b>&#189; onion</b>, <b>1 jalape&#241;o</b>, <b>&#8531; cup cilantro</b>.",25,ACT.chop(TOMATO),{dur:"10 min"}),
  st("Squeeze Party","Squeeze the limes! Sprinkle the salt! Wheee!","Toss with <b>juice of 1&#8211;2 limes</b> and salt to taste.",65,ACT.stir(TOMATO),{dur:"2 min"}),
  st("The Waiting Game","Now we wait 20 minutes. *taps paw* ...worth it.","Let it sit at least 20 min so the flavors meld.",90,ACT.stir(TOMATO),{dur:"20 min rest"}),
  st("Fresh & Zippy","Bright, crunchy, zippy. On EVERYTHING, please.","Taste, adjust lime and salt, and serve.",100,ACT.serve('bowl',TOMATO),{dur:"\u00A1Listo!"})
 ]}
 ,{id:"salad",name:"🥗 Chopped Salad",meter:"🥗 Salad Meter",steps:[
  st("Chill Out, Chicken","Brrr! Fridge-cold chicken is sad chicken. A little counter time fixes it.","Pull about <b>3 cups</b> of rotisserie chicken (about 1 lb) and let it sit on the counter to lose the fridge chill.",0,ACT.season(CHK),{dur:"20 min",timer:1200,timerLbl:"Warm up"}),
  st("Honey Mustard Magic","Whisk whisk whisk! Sweet, tangy, and totally dog approved.","In your widest bowl, whisk <b>2 tbsp apple cider vinegar</b>, <b>1 tbsp dijon</b>, <b>2 tsp honey</b>, <b>&#188; tsp salt</b> and <b>&#189; tsp pepper</b> until the salt dissolves. Then drizzle in <b>6 tbsp olive oil</b> while you keep whisking.",15,ACT.whisk(CHEESE),{dur:"3 min"}),
  st("Chop Chop Chicken","No long stringy bits! Chickpea size, like tiny treats.","Run your knife through the chicken until the pieces are <b>chickpea size</b>. Toss it with a spoonful of the dressing in its own bowl and let it sit.",30,ACT.chop(CHK),{dur:"3 min"}),
  st("The Chickpea Ruler","Everything the size of a chickpea. That's the rule. I made the rule.","<b>3 romaine hearts</b>: stack, slice lengthwise, then across. <b>4 or 5 celery stalks</b> thin on a bias. Most of <b>1 red onion</b>, thin, half-moons cut in half. <b>&#190; cup cashews</b> rough chopped. <b>&#8532; cup feta</b> crumbled. Rinse <b>1 can chickpeas</b> and dry them on a towel.",55,ACT.chop(GUAC),{dur:"~8 min"}),
  st("Heavy Stuff First","Lift and fold, lift and fold. No stirring! Stirring is for soup.","Celery, chickpeas, chicken and onion into the dressing. <b>Lift and fold</b> from the bottom, don't stir.",72,ACT.stir(CHK),{dur:"1 min"}),
  st("Greens Go In","Fifteen folds! I'm counting on my paws. I ran out of paws.","Add the romaine and fold <b>15 to 20 turns</b>, turning the bowl as you go. Start with half the dressing and add more only if it needs it.",88,ACT.stir(GUAC),{dur:"2 min"}),
  st("Crunch Time!","Cashews on top so they stay crunchy. Dinner for two, crumbs for Kenny?","Feta and cashews go on <b>dead last</b> with one gentle fold. Eat right away.",100,ACT.serve('bowl',GUAC),{dur:"Dig in!"})
 ]}
 ,{id:"burgers",name:"🍔 Smoked Burgers",meter:"🍔 Burger Meter",steps:[
  st("Gentle Paws, Patty","Easy does it! Squeeze too hard and you get hockey pucks.","Divide <b>1 lb 80/20 ground beef</b> into 4. Press each gently, <b>wider than your bun</b>, and thumb a shallow dimple in the middle. Salt and pepper the <b>outside only</b>. Straight from the fridge, <b>no freezer</b>, that's what left the last batch raw.",0,ACT.season(MEAT),{dur:"5 min"}),
  st("Low and Smoky","Lowest setting, little grill. Just whisper at them.","Traeger to <b>180&#176;F</b>, as low as yours goes. Cherry pellets. Give it 15 min to settle.",15,ACT.fireup(),{dur:"~15 min",timer:900,timerLbl:"Preheat"}),
  st("A Quick Sniff","Fifteen minutes of smoke. Short and sweet, like my legs.","Patties on. <b>15 min at 180&#176;F</b>, lid closed, no flipping. Don't oil them, a dry surface grabs smoke. They'll look grey and that's normal.",40,ACT.smokewait(MEAT),{dur:"15 min",timer:900,timerLbl:"Smoke"}),
  st("Crank It, Leave Them","Nobody move! The burgers stay right there. That's the whole trick.","<b>Dial to 500&#176;F and leave the patties on the grate.</b> Do not pull them off to a plate. The 15 to 20 min the grill takes to climb is what actually cooks them. Pulling them is what ruined the last batch.",65,ACT.fireup(),{dur:"15–20 min",timer:1080,timerLbl:"Heat climb"}),
  st("The Big Sizzle","Ssss-SSSS! Cheese on, lid down. Almost dinner!","Once it's at 500, <b>flip once</b> and finish by eye: <b>2 to 3 min a side</b>, not 60 seconds. Cheese right after the flip, lid down to melt. Ground beef wants <b>160&#176;F</b>, and you can check it by sliding the probe in <b>from the side</b>, not down through the top. Don't press them.",88,ACT.flip(MEAT),{dur:"~5 min",timer:150,timerLbl:"Sear side",sizzle:true}),
  st("Toast & Stack","Buns toasted, burgers stacked. I'm gonna sit right here and stare at you.","Buns cut side down on the grate for the <b>last 45 sec</b>. Rest the patties <b>2 min</b>, then build. Smoking renders out more fat than grilling, which is why 80/20 was not optional.",100,ACT.serve('plate',MEAT),{dur:"Chow time!"})
 ]},
 {id:"chili",name:"🌶️ Smoked Texas Chili",meter:"🌶️ Chili Meter",steps:[
  st("Toast the Chile Squad","Toast, soak, BLEND. Don't burn 'em or we start over!","Stem &amp; seed <b>6 ancho, 4 guajillo, 3 &#225;rbol, 2 chipotle morita</b>. Toast 30 sec a side, soak 30 min in <b>3 cups hot beef stock</b>, blend smooth.",10,ACT.blend(CHILI),{dur:"~45 min",timer:1800,timerLbl:"Soak"}),
  st("Dress the Chuck","Big cubes, big salt. Mr. Beef is getting ready.","Cube <b>4 lb chuck</b> (&#190; in). Toss with oil, heavy <b>kosher salt</b>, coarse <b>pepper</b>. Dice <b>1 lb bacon</b>; break up <b>1 lb ground meat</b>.",18,ACT.season(MEAT),{dur:"10 min"}),
  st("The Smoke Bath","Two hours of smoke. Pecan or oak. I'll guard the door.","Smoker <b>250&#176;F</b>, pecan or oak. Chuck on a rack, ground meat &amp; bacon in foil pans. Smoke <b>2 hrs</b>. Save every drop of drippings.",35,ACT.smokewait(MEAT),{dur:"2 hr",timer:7200,timerLbl:"Smoke"}),
  st("Sizzle Town","Render the bacon, sear the chuck. Don't crowd the pan!","Render bacon till crisp, scoop out. Sear chuck in batches in the bacon fat, hard, 2&#8211;3 min a side.",48,ACT.flip(MEAT),{dur:"~20 min",sizzle:true}),
  st("Build the Pot","Onions, jalape&#241;os, garlic, spices bloom... then BEER. Scrape that pot!","Cook <b>2 onions + 6 jalape&#241;os</b> 8 min, <b>10 garlic</b> 1 min. Bloom <b>cumin, oregano, smoked paprika, coriander, pepper, cayenne</b> 60 sec. Tomato paste 2&#8211;3 min. <b>1 bottle beer</b>, reduce by half. Add puree, tomatoes, stock, bay, all the meat + drippings.",60,ACT.stir(CHILI),{dur:"~30 min"}),
  st("Back Into the Smoke","Lid OFF, habaneros IN. Taste at 90 minutes... carefully.","Smoker <b>275&#176;F</b>. Add <b>3&#8211;5 slit habaneros</b>. Pot on, <b>uncovered</b>, 2&#8211;2.5 hrs, stir every 45 min. Taste heat at 90 min, fish the peppers out when it's right.",80,ACT.stir(CHILI),{dur:"2–2.5 hr",timer:5400,timerLbl:"Smoke"}),
  st("The Big Finish","Fork-tender chuck, masa slurry, splash of vinegar. Taste, taste, taste!","Stove, low, lid cracked ~45 min till chuck is fork-tender. Whisk <b>&#188; cup masa</b> into &#190; cup warm water, stir in, 15 min. Bay out. <b>2 tbsp cider vinegar</b>. Salt first, then adjust.",94,ACT.stir(CHILI),{dur:"~1 hr",timer:2700,timerLbl:"Simmer"}),
  st("Bowl of Red!","Cornbread, cheddar, onions. Better on day two, but who can wait?","Rest 20 min off heat. Serve with cornbread or Fritos, cheddar, onion, sour cream, lime.",100,ACT.serve('bowl',CHILI),{dur:"Feast!"})
 ]},
 {id:"cornbreadchili",name:"🍞 Chili Cornbread Skillet",meter:"🍞 Skillet Meter",steps:[
  st("Chorizo Goes First","Red fat in the pan! That's the good stuff. Don't you dare pour it out.","<b>No oil.</b> Render <b>1 lb fresh chorizo</b> in a <b>12-in cast-iron skillet</b> over <b>medium</b>, 4&#8211;5 min, until it has color and has given up its fat. Scoop the chorizo out with a slotted spoon and <b>leave the fat in the pan</b>. The beef browns in that fat, which is the whole trick.",10,ACT.stir(CHILI),{dur:"5 min"}),
  st("Brown It in the Red Fat","Beef goes in the chorizo fat. Nobody's adding oil today.","Turn the heat up and brown <b>1 lb lean ground beef (90/10)</b> in the chorizo fat with <b>1 tsp salt</b>. Drain back down to about <b>2 tbsp</b> of fat. Add <b>2 poblanos, 1 onion, 1 jalape&#241;o, 2 garlic</b>, then <b>2 tsp chili powder, 2 tsp cumin</b>, a <b>15 oz can chili beans</b>, <b>15 oz tomato sauce</b>, <b>14.5 oz diced tomatoes</b>. Chorizo back in. <b>Skip the water</b>, there's 2 lb of meat in here now. Simmer 10 min.",22,ACT.stir(CHILI),{dur:"~25 min"}),
  st("Low &amp; Smoky Snooze","Just 180 degrees. The chili sips smoke like tea.","Traeger to <b>180&#176;F</b>. Skillet on the bottom grate, smoke <b>1 hr</b>, stir once halfway.",35,ACT.smokewait(CHILI),{dur:"1 hr",timer:3600,timerLbl:"Smoke"}),
  st("Whisk the Corny Hat","Jiffy, buttermilk, egg, corn, cheese. Stir stir stir!","Whisk <b>1 box (8 oz) Jiffy corn muffin mix</b>, <b>&#189; cup buttermilk</b>, <b>1 egg</b>. Stir in <b>&#189; cup corn</b>, <b>&#188; cup sharp cheddar</b>, <b>&#188; cup sliced scallions</b>. Chill till the chili's done.",45,ACT.whisk(CHEESE),{dur:"5 min"}),
  st("Crank It Up","Skillet out, dial UP. Hot hot hot!","Pull the skillet to a heatproof spot. Close the lid and raise the Traeger to <b>400&#176;F</b>.",55,ACT.fireup(),{dur:"~10 min"}),
  st("Put the Hat On","Dollop, spread, leave a little edge. Like tucking it in.","Dollop the batter over the chili and spread it evenly, leaving about a <b>1-inch border</b> around the edge.",65,ACT.stir(CHEESE),{dur:"3 min"}),
  st("Golden Top Bake","Toothpick test, then victory.","Back on the grill at 400&#176;F for <b>30&#8211;45 min</b>, until the cornbread is golden and a toothpick in the center comes out clean.",90,ACT.smokewait(CHEESE),{dur:"30–45 min",timer:1800,timerLbl:"Bake"}),
  st("Scoop &amp; Serve","Chili on the bottom, cornbread on top, corgi very pleased.","Spoon into bowls, cornbread and all. Sprinkle with <b>cilantro</b>. Butter on the cornbread never hurt anybody.",100,ACT.serve('bowl',CHILI),{dur:"Feast!"})
 ]},
 {id:"filet",name:"🥩 Reverse Sear Filet",meter:"🥩 Filet Meter",steps:[
  st("Salt the Fancy Steak","Salt on every side. Even the edges. I checked.","Salt <b>one <span class='ns'>7&#8211;8 oz</span> filet</b> (at least 1.5 in thick) all over, sides too. Uncovered on a plate in the fridge, about <b>2.5 hr</b>. Dry surface, fast crust.",5,ACT.season(MEAT),{dur:"~2.5 hr"}),
  st("Wake Up, Grill!","Low and gentle tonight, grill. Indoor voice.","Traeger to <b>225&#176;F</b>. Steak out on the counter. Cut the top off <b><span class='ns'>1 head</span> garlic</b>, drizzle oil, wrap in foil. Set a stick of <b>butter</b> out to soften.",15,ACT.fireup(),{dur:"~15 min",timer:900,timerLbl:"Preheat"}),
  st("Smoky Snooze","Probe in, alarm set, paws up. The grill's got this.","Steak and garlic packet on at 225. Probe alarm at <b>112&#176;F</b>. About 50 min, but go by the probe.",40,ACT.smokewait(MEAT),{dur:"~50 min",timer:3000,timerLbl:"Smoke"}),
  st("Off at 112, Crank It","Beep beep! Steak takes a little break. Grill goes BIG.","At <b>112&#176;F</b> pull the steak to a plate, garlic off. Dial to <b>500&#176;F</b>. A thick filet waits happily on the counter while it climbs.",55,ACT.fireup(),{dur:"12–15 min",timer:780,timerLbl:"Heat climb"}),
  st("Butter & Beans","Smoky garlic squish! Half for butter, half for beans. Fair is fair.","Squeeze the smoked garlic out. Half into the butter with chopped <b>thyme</b> and a pinch of salt. Half into a pan with <b>1 can cannellini</b>, olive oil and a splash of can liquid. Warm, mash about half, add <b>lemon</b> and salt.",70,ACT.stir(ONION),{dur:"~10 min"}),
  st("The Big Sear","Ssss! Both sides AND the edges. Restaurant style, baby.","At 500: <b>90 sec a side</b>, then stand it on its edges <b>30 sec each</b>. <b>Green beans</b>, oiled and salted, go on beside it for 4&#8211;5 min. Steak <b>off at 125&#176;F</b>.",88,ACT.flip(MEAT),{dur:"~5 min",timer:90,timerLbl:"Sear side",sizzle:true}),
  st("Butter Blanket","Garlic butter on top. Now we wait 8 minutes. *stares*","Spoon of garlic butter on the steak right away. Rest <b>8 min</b>. It settles around 132&#176;F, medium rare.",95,ACT.season(MEAT),{dur:"8 min",timer:480,timerLbl:"Rest"}),
  st("Fancy Plate Time","Beans, steak, beans on the side. Very fancy. Very me.","Beans down first, steak on top, green beans alongside. Any butter left goes over everything.",100,ACT.serve('plate',MEAT),{dur:"Impress!"})
 ]},
 {id:"harissa",name:"🌶️ Harissa Chicken",meter:"🍗 Harissa Meter",steps:[
  st("Dry Brine Dance","Pat pat pat, salt salt salt. Crispy skin starts NOW.","Pat <b>4 bone-in, skin-on thighs</b> (about 2 lb) bone dry. Salt both sides. Skin up, <b>uncovered</b>, in the fridge at least 1 hr.",5,ACT.season(CHK),{dur:"1 hr+"}),
  st("Yogurt Swirl","Cool, creamy, lemony. Do I get a lick? No? Okay.","Stir <b>Greek yogurt</b> with 1 grated garlic clove, juice of &#189; lemon, a pinch of salt and a splash of water. Chop a handful of <b>parsley</b>. Both back in the fridge.",20,ACT.whisk(POTATO),{dur:"5 min"}),
  st("Chickpea Bed","Dry chickpeas get crispy. Wet ones get mushy. Towel time!","Oven to <b>425&#176;F</b>. Drain <b>2 cans chickpeas</b> and dry them on a towel. Toss on a sheet pan with <b>1 red onion</b> in thick wedges, a real glug of olive oil, <b>1 tsp each cumin, coriander, smoked paprika</b>, salt. One layer.",40,ACT.chop(ONION),{dur:"~10 min"}),
  st("Spicy Jackets","Harissa under the skin. Sneaky flavor! I love sneaky.","Mix <b>2 tbsp harissa</b> with 1 tbsp olive oil. Rub over the thighs and <b>under the skin</b>. No more salt. Skin up, right on the chickpeas.",55,ACT.season(TOMATO),{dur:"3 min"}),
  st("Walk Away","Fifty minutes. I'll guard the oven. Very serious job.","Middle rack, <b>50 min</b>, until the skin is deep brown and the thighs hit <b>180&#176;F</b>. Not 165, the extra heat makes them tender.",88,ACT.smokewait(CHK),{dur:"50 min",timer:3000,timerLbl:"Roast"}),
  st("Crispy Finish","Lemon squeeze, big yogurt spoon. Dinner! Is there a corgi portion?","Skin went soft? <b>2&#8211;3 min under the broiler</b>. Squeeze the other lemon half over the pan. Chickpeas down, chicken on top, yogurt, parsley, <b>feta</b> if you have it.",100,ACT.serve('plate',CHK),{dur:"Dig in!"})
 ]},
 {id:"walkingtacos",name:"🌮 Walking Tacos",meter:"🌮 Taco Meter",steps:[
  st("Beef Crumble","Break it up, brown it good. Little beefy pebbles!","Brown <b>1 lb 80/20 ground beef</b> in a skillet, breaking it up. Drain the fat.",25,ACT.stir(MEAT),{dur:"~8 min",sizzle:true}),
  st("Taco Magic","Sprinkle, splash, simmer. The kitchen smells like Tuesday!","Stir in <b>1 packet taco seasoning</b> and about <b>&#8532; cup water</b>. Simmer <b>5 min</b> until it tightens up.",55,ACT.stir(MEAT),{dur:"5 min",timer:300,timerLbl:"Simmer"}),
  st("Topping Station","Everybody picks their own. Onion stays OFF the meat!","Dice <b>1 small red onion</b> raw, topping only. Slice <b>2 jalape&#241;os</b> thin, seeds out for less heat. Set out <b>shredded Mexican cheese</b>, <b>salsa</b>, <b>sour cream</b>.",80,ACT.chop(ONION),{dur:"5 min"}),
  st("Crunch & Stack!","Chips, meat, cheese, toppings. In that order. Corgi rules.","Crush <b>corn chips</b> (Fritos Scoops or Doritos) a little in each bowl. Hot meat, then cheese so it melts (a slice of <b>American</b> over the meat is great), then the cold stuff last.",100,ACT.serve('taco'),{dur:"Crunch time!"})
 ]},
 {id:"ribeye",name:"🥩 Ribeye Cookout",meter:"🥩 Steak-o-Meter",steps:[
  st("Rub-a-Dub Steak","Gospel on the steak, Honey Hog on the corn. Everybody gets dressed!","Salt a thick <b>ribeye</b> and hit it with <b>Meat Church Gospel</b> (or Holy Cow). Brush husked <b>corn</b> with a little oil and dust with <b>Honey Hog</b>.",5,ACT.season(MEAT),{dur:"5 min"}),
  st("Wake Up, Grill!","Low and smoky tonight. Shhh, the cherry wood is thinking.","Traeger to <b>225&#176;F</b>, cherry pellets. Give it a full 15 min. It runs cooler than the dial.",12,ACT.fireup(),{dur:"~15 min",timer:900,timerLbl:"Preheat"}),
  st("Smoke Nap","Steak and corn, side by side. Best nap buddies.","Steak and corn on at 225. Probe the steak. <b>Pull at 120&#176;F</b> for medium rare, <b>130&#176;F</b> for medium. About 45&#8211;60 min, but go by the probe.",40,ACT.smokewait(MEAT),{dur:"45–60 min",timer:3000,timerLbl:"Smoke"}),
  st("Cloud Potatoes","Fluffy little clouds. Not too much butter this time. I'm watching.","While it smokes: boil peeled <b>russets</b> for two, rice them, fold in warm milk and <b>half the butter</b> you think. Keep it loose. Hold warm over a pot of simmering water.",60,ACT.boil(POTATO),{dur:"~25 min",timer:1080,timerLbl:"Boil"}),
  st("Crank It Way Up","Steak takes a break. Grill goes BIG. Ears back!","Steak off to a plate at your pull temp. Corn stays on. Dial to <b>500&#176;F</b> and wait for it.",72,ACT.fireup(),{dur:"12–15 min",timer:780,timerLbl:"Heat climb"}),
  st("The Big Sizzle","Ssss! Crust on the steak, char on the corn. Fancy!","At 500: steak <b>1&#8211;2 min a side</b>. Turn the corn for a little char at the same time. It'll climb about 10&#176;F while it rests.",88,ACT.flip(MEAT),{dur:"~4 min",timer:90,timerLbl:"Sear side",sizzle:true}),
  st("Slice It Right","Rest, then slice across the lines. Hi-YA!","Rest <b>5&#8211;10 min</b>. Find the grain and slice <b>across</b> it to split the steak.",95,ACT.slice(MEAT),{dur:"rest + slice",timer:420,timerLbl:"Rest"}),
  st("Cookout Feast!","Steak, corn, potato clouds. I'll take the corn cob. Kidding. Mostly.","Potatoes down, sliced steak on top, corn on the side.",100,ACT.serve('plate',MEAT),{dur:"Feast!"})
 ]},
 {id:"pulledpork",name:"🐷 Pulled Pork",meter:"🐷 Pork Meter",steps:[
  st("Rub Down Day","Mustard glue, then the rub. Piggy is getting a spa day.","Night before or morning of: pat dry a <b>7&#8211;8 lb bone-in pork butt</b>. Thin coat of <b>yellow mustard</b>, then a heavy coat of <b>Meat Church Honey Hog</b>.",5,ACT.season(PORK),{dur:"10 min"}),
  st("Fire It Up","Early start! Coffee for you, cherry pellets for the grill.","Traeger to <b>250&#176;F</b>, cherry pellets. Plan about <b>1.5 hr per pound</b> total, plus rest. Start early, your grill runs cool.",12,ACT.fireup(),{dur:"~15 min",timer:900,timerLbl:"Preheat"}),
  st("The Long Smoke","Fat side up, probe in, walk away. I'll guard it. All day.","Pork on, fat side up. Probe in the thickest part, away from the bone. Smoke until the bark is set and dark, around <b>165&#176;F</b>. Usually 5&#8211;6 hr.",40,ACT.smokewait(PORK),{dur:"5–6 hr",timer:3600,timerLbl:"Smoke check"}),
  st("Beat the Stall","Stuck at 165? Totally normal. Wrap it up like a burrito!","When it stalls around 160&#8211;165&#176;F, wrap tight in <b>foil or butcher paper</b> with a splash of <b>apple juice</b>. Back on.",55,ACT.braise(PORK),{dur:"5 min"}),
  st("Probe Like Butter","203 degrees! The probe should slide in like warm butter.","Cook to about <b>203&#176;F</b>, until the probe slides in with no fight. Another 2&#8211;3 hr.",78,ACT.smokewait(PORK),{dur:"2–3 hr",timer:3600,timerLbl:"Finish check"}),
  st("Cozy Rest","Wrapped in towels, napping in a cooler. Don't peek!","Keep it wrapped. Into a dry cooler with towels for at least <b>1 hr</b>. It holds hot for up to 3.",88,ACT.braise(PORK),{dur:"1 hr+",timer:3600,timerLbl:"Rest"}),
  st("Pull Party","The bone slides right out! Shred shred shred!","Unwrap, pull the bone, shred with forks or gloved hands. Toss in the juices from the wrap and a little more rub.",95,ACT.slice(PORK),{dur:"10 min"}),
  st("Sandwich Time!","Bun, pork, slaw. Repeat all week. Best week ever.","Pile on buns with slaw and your favorite sauce. Leftovers go into tacos, bowls and mac.",100,ACT.serve('plate',PORK),{dur:"Feast!"})
 ]},
 {id:"meatloaf",name:"🍞 Smoked Meatloaf",meter:"🍞 Loaf Meter",steps:[
  st("Soggy Crumbs (On Purpose)","Breadcrumbs take a milk bath. It keeps the loaf juicy!","Stir <b>&#190; cup panko</b> into <b>&#189; cup milk</b>. Let it sit 5 min.",8,ACT.stir(RICE),{dur:"5 min"}),
  st("Squish It Together","Gentle paws! Mix just until it holds. No squeezing!","Add <b>2 lb 80/20 ground beef</b>, <b>2 eggs</b>, <b>1 small onion</b> grated, <b>2 garlic</b>, <b>1 tbsp Worcestershire</b>, <b>1.5 tsp kosher salt</b>, <b>&#189; tsp pepper</b>. Mix just until combined.",22,ACT.stir(MEAT),{dur:"5 min"}),
  st("Shape the Loaf","A free-form loaf. More outside means more smoky bark!","Shape a loaf about 4 in wide on a rack or foil pan with holes poked in it. Dust the outside with <b>Meat Church Gospel</b>.",32,ACT.season(MEAT),{dur:"3 min"}),
  st("Smoke Bath","An hour of smoke. Low and slow, then we turn it up.","Traeger to <b>225&#176;F</b>, cherry pellets. Loaf on, probe in the center. Smoke <b>1 hr</b>.",55,ACT.smokewait(MEAT),{dur:"1 hr",timer:3600,timerLbl:"Smoke"}),
  st("Turn It Up","Up to 350! The loaf is getting serious now.","Raise the grill to <b>350&#176;F</b>. Cook until the center hits about <b>150&#176;F</b>, usually 30&#8211;45 min.",75,ACT.fireup(),{dur:"30–45 min",timer:2400,timerLbl:"Cook"}),
  st("Sticky Glaze","Shiny sweet glaze. Brush brush brush!","Stir <b>&#189; cup BBQ sauce</b> with <b>2 tbsp honey</b>. Brush it on and cook until the center hits <b>160&#176;F</b>, about 15&#8211;20 min.",90,ACT.stir(TOMATO),{dur:"15–20 min",timer:1080,timerLbl:"Glaze"}),
  st("Slice & Serve","Rest ten, then thick slices. Cold sandwiches tomorrow? Yes please.","Rest <b>10 min</b> so it slices clean. Thick slices with the cloud potatoes or green beans.",100,ACT.serve('plate',MEAT),{dur:"Dig in!"})
 ]},
 {id:"turkey",name:"🦃 Spatchcock Turkey",meter:"🦃 Turkey Meter",steps:[
  st("Flat Bird Magic","Snip out the backbone and squish it flat. Flat birds cook even!","Cut out the backbone of a <b>12&#8211;14 lb turkey</b> with poultry shears. Flip it and press hard on the breastbone until it lies flat. Save the backbone for gravy.",5,ACT.chop(CHK),{dur:"15 min"}),
  st("Dry Brine Nap","Salt, then fridge, uncovered. Dry skin is crispy skin!","Salt all over, about <b><span class='ns'>1 tsp</span> kosher salt per lb</b>, some under the skin. Uncovered on a rack in the fridge <b>24&#8211;48 hr</b>.",15,ACT.season(CHK),{dur:"1–2 days"}),
  st("Butter Under the Skin","Sneaky butter pockets. My favorite kind of sneaky!","Mash <b>1 stick softened butter</b> with <b>Meat Church Honey Hog</b> or chopped herbs. Rub it under the breast and thigh skin. No more salt.",25,ACT.season(CHEESE),{dur:"10 min"}),
  st("Hot & Smoky","Hotter than usual today. Crispy skin needs heat!","Traeger to <b>325&#176;F</b>, cherry pellets. Plan extra time, your grill runs cool.",32,ACT.fireup(),{dur:"~15 min",timer:900,timerLbl:"Preheat"}),
  st("Gobble Gobble Cook","Two probes, one in the breast. I'm on bird watch.","Bird on, skin up, legs toward the hot side. Probe the thickest part of the breast. Pull when the <b>breast hits 160&#176;F</b> and thighs read <b>175&#176;F+</b>. About <b>2&#8211;2.5 hr</b>.",75,ACT.smokewait(CHK),{dur:"2–2.5 hr",timer:3600,timerLbl:"Check temps"}),
  st("The Big Rest","Thirty minutes, loosely tented. It keeps cooking while it naps!","Rest <b>30 min</b>, loosely tented with foil. The breast climbs to 165.",88,ACT.braise(CHK),{dur:"30 min",timer:1800,timerLbl:"Rest"}),
  st("Carve the Bird","Breasts off whole, then slice across. Legs and thighs too!","Take each breast off whole, then slice across into thick pieces. Separate legs and thighs.",95,ACT.slice(CHK),{dur:"15 min"}),
  st("Thanksgiving!","Big platter, big family, big corgi appetite. Gobble gobble!","Platter it up. Pour any resting juices over the top.",100,ACT.serve('plate',CHK),{dur:"Feast!"})
 ]},
 {id:"breakfasttacos",name:"🍳 Breakfast Tacos",meter:"🍳 Breakfast Meter",steps:[
  st("Bean Warm-Up","Good morning, beans! Wakey wakey, little guys.","Drain and rinse <b>1 can black beans</b>. Warm them in a small pot over low with a splash of water and a pinch of salt.",15,ACT.stir(BEANS),{dur:"5 min"}),
  st("Tiny Spicy Dice","Little green jalape&#241;o cubes. Those are for the grown-ups!","Dice <b>1&#8211;2 jalape&#241;os</b>, seeds out for less heat. Crumble the <b>feta</b>. Set out the <b>hot sauce</b>.",30,ACT.chop(GUAC),{dur:"3 min"}),
  st("Soft & Fluffy Eggs","Low heat, slow stir. Fluffy clouds of egg!","Whisk <b>6 eggs</b> with a pinch of salt. Butter in a nonstick pan on <b>medium-low</b>. Stir slowly and pull them while they still look a little wet. They finish on the plate.",65,ACT.whisk(CHEESE),{dur:"~4 min"}),
  st("Warm the Shells","Quick flip in a hot pan. Soft and toasty!","Warm the <b>small soft taco shells</b> in a dry skillet, about 20 sec a side, or wrapped in a damp towel in the microwave for 30 sec.",82,ACT.flip(POTATO),{dur:"2 min"}),
  st("Build-a-Taco","Beans, eggs, feta, then the spicy stuff. Taco morning!","Beans first, then eggs, then <b>feta</b>. Jalape&#241;os and hot sauce on top for whoever wants the kick.",100,ACT.serve('taco'),{dur:"Good morning!"})
 ]},
 {id:"crazybread",name:"💛 Grandma's Crazy Bread",meter:"💛 Crazy Bread Meter",steps:[
  st("Grandma's Secret Box","The box that started it all. This one's a family treasure!","Stir the <b>Pillsbury Hot Roll Mix</b> and its yeast packet together. Add <b>1 cup hot water</b> (120&#8211;130&#176;F, hot tap water), <b>2 tbsp soft butter</b> and <b>1 egg</b>. Stir until it pulls into a dough. Check the box for any changes.",8,ACT.stir(POTATO),{dur:"5 min"}),
  st("Rise in the Bowl","Cover it up and let it puff. Shhh, the dough is growing!","Cover the bowl with a towel and set it somewhere warm. Let it rise right in the bowl until about <b>doubled</b>, 30&#8211;40 min.",35,ACT.stir(POTATO),{dur:"30–40 min",timer:2100,timerLbl:"Rise"}),
  st("Oil at 350","Not too cool, not too hot. Just right, like Goldilocks!","Heat about <b>1 inch of avocado oil</b> (or canola) in a heavy pot to <b>350&#176;F</b>. Use a thermometer. Hot oil seals the outside fast, so the bread soaks up <b>less oil</b>. Set a rack over paper towels next to the stove.",50,ACT.boil(CHEESE),{dur:"~10 min"}),
  st("Float & Puff","Watch it puff up and FLOAT! That's the magic part!","Pull pieces of dough right out of the bowl and drop them in the oil, a few at a time. Don't crowd them. Leave them until they puff up big and float, and the bottom is golden. Then <b>flip</b> and brown the other side a few minutes.",68,ACT.flip(CHEESE),{dur:"~4 min a batch",sizzle:true}),
  st("Parm Snow","Out of the oil, straight into a cheesy snowstorm!","Lift them onto the rack and <b>right away</b> cover with grated <b>parmesan</b> so it sticks. Let the oil come back to 350 before the next batch.",85,ACT.season(CHEESE),{dur:"each batch"}),
  st("Dip Time","Warm pizza sauce for dunking. Just like Grandma made it!","Microwave a jar of <b>pizza sauce</b> until warm, about a minute, stirring halfway.",94,ACT.stir(TOMATO),{dur:"1 min"}),
  st("Pass It On!","Crispy outside, soft inside, made with love. For Ivy, someday!","Serve warm with the sauce for dipping. Best eaten right away, standing around the kitchen.",100,ACT.serve('bowl',CHEESE),{dur:"Family time!"})
 ]},
 {id:"potroast",name:"🍲 Sunday Pot Roast",meter:"🍲 Roast Meter",steps:[
  st("Salt the Night Before","Salt tonight, tender tomorrow. Patience, says the corgi.","Saturday night (or at least 1 hr before): salt a <b>3&#8211;3.5 lb chuck roast</b> all over, about 2 tsp kosher salt. Uncovered in the fridge.",5,ACT.season(MEAT),{dur:"Overnight"}),
  st("The Big Brown","Ssss! A deep dark crust. That's where the flavor lives!","Oven to <b>300&#176;F</b>. Pat the roast dry, pepper it. Sear hard in the Dutch oven with a little oil, <b>4&#8211;5 min a side</b>, until deep brown. Pull it out.",18,ACT.flip(MEAT),{dur:"~15 min",sizzle:true}),
  st("Onions & Broth","Onions in, scrape up the brown bits. Those bits are treasure!","Lower the heat. Cook <b>1 big onion</b>, sliced, 5 min. Add <b>4 garlic</b> 1 min. Pour in <b>2 cups beef broth</b> and <b>1 tbsp Worcestershire</b>, scraping the bottom. Add <b>thyme, rosemary, 2 bay leaves</b>.",30,ACT.stir(BEANS),{dur:"~10 min"}),
  st("The Long Sunday Nap","Lid on, into the oven. Now we all nap. Even me.","Roast back in, lid on, into the oven. <b>2.5 hr</b> at 300&#176;F.",55,ACT.braise(MEAT),{dur:"2.5 hr",timer:9000,timerLbl:"Braise"}),
  st("Veggie Party","Potatoes and carrots jump in the pool! Cannonball!","Add <b>1.5 lb Yukon golds</b>, halved, and <b>4 carrots</b> in big chunks around the roast. Lid on, back in <b>1&#8211;1.5 hr</b> until the meat falls apart with a fork and the potatoes are tender.",80,ACT.braise(POTATO),{dur:"1–1.5 hr",timer:4500,timerLbl:"Braise"}),
  st("Gravy Magic","Thicken the juices. Shiny gravy for everybody!","Move meat and veggies to a platter and tent with foil. Skim the fat. Bring the liquid to a simmer, whisk in <b>1 tbsp cornstarch</b> stirred into 2 tbsp cold water. Simmer 2 min. Taste for salt.",92,ACT.stir(BEANS),{dur:"~5 min"}),
  st("Sunday Supper!","The whole family at the table. Best day of the week!","Pull the roast into big chunks. Veggies around it, gravy over everything. Leftovers make Monday sandwiches.",100,ACT.serve('plate',MEAT),{dur:"Family time!"})
 ]}
];

var F={
 skirt:function(x,y,m){return P_("M"+(x-30)+" "+(y-4)+" Q"+(x-10)+" "+(y-12)+" "+(x+30)+" "+(y-7)+" L"+(x+28)+" "+(y-1)+" Q"+(x-8)+" "+(y-4)+" "+(x-30)+" "+(y)+" Z","#8A3B2C")+(m?F._marks(x,y-5,4):"")+P_("M"+(x-20)+" "+(y-6)+" q14 -4 36 -2","none",0.8);},

 filet:function(x,y,m){return R_(x-14,y-18,28,18,9,"#8E3A2B")+E_(x,y-17,14,5,"#A2453A")+(m?"<line x1='"+(x-8)+"' y1='"+(y-19)+"' x2='"+(x+6)+"' y2='"+(y-15)+"' stroke='#3a1a12' stroke-width='2'/>":"");},
 chuck:function(x,y){return P_("M"+(x-26)+" "+y+" L"+(x-24)+" "+(y-18)+" Q"+(x)+" "+(y-24)+" "+(x+24)+" "+(y-17)+" L"+(x+26)+" "+y+" Z","#8A3B2C")+P_("M"+(x-14)+" "+(y-10)+" q8 4 18 -2 M"+(x+4)+" "+(y-16)+" q3 5 10 4","none",1);},
 roast:function(x,y){return F.chuck(x,y)+P_("M"+(x-24)+" "+(y-14)+" q24 -6 48 0","none",1);},
 cubes:function(x,y){var s="";[[-18,0],[-6,0],[6,0],[18,0],[-12,-9],[0,-9],[12,-9]].forEach(function(p){s+=R_(x+p[0]-5,y+p[1]-9,10,9,2,"#8A3B2C");});return s;},
 porkbutt:function(x,y){return P_("M"+(x-28)+" "+y+" Q"+(x-30)+" "+(y-22)+" "+(x-6)+" "+(y-25)+" Q"+(x+26)+" "+(y-26)+" "+(x+28)+" "+y+" Z","#B5643F")+P_("M"+(x-18)+" "+(y-16)+" q6 -6 14 -3 M"+(x+4)+" "+(y-20)+" q8 0 12 6","none",1)+C_(x+22,y-8,3,"#F2E4C8");},

 var pct=document.getElementById("meterPct");pct.textContent=s.cook===0?"Raw":s.cook<40?"Getting going":s.cook<70?"Getting there":s.cook<100?"Almost!":"\uD83C\uDFC6 Done!";
 document.getElementById("back").disabled=(cur===0);
 var nx=document.getElementById("next");nx.textContent=cur===steps.length-1?"\uD83C\uDF89 Done!":"Next \u25B6";
 renderPaws();renderIngBtn();
 if(cur===steps.length-1)bigFinale();
 save();
}

document.getElementById("next").onclick=function(){ensureCtx();var steps=RECIPES[ridx].steps;if(cur<steps.length-1){cur++;render();}else{bigFinale();}};
document.getElementById("back").onclick=function(){if(cur>0){cur--;render();}};
document.getElementById("scene").onclick=boop;
document.getElementById("boop").onclick=boop;
function boop(){var sc=document.getElementById("scene");var prev=sc.innerHTML;document.getElementById("bubble").textContent=BOOPS[Math.floor(Math.random()*BOOPS.length)];if(!sc.querySelector("image[data-pose='cheer']")){sc.innerHTML=idleScene();clearTimeout(window._bt);window._bt=setTimeout(function(){if(sc.querySelector("image[data-pose='idle']"))sc.innerHTML=prev;},2200);}sc.classList.remove("boop");void sc.offsetWidth;sc.classList.add("boop");setTimeout(function(){sc.classList.remove("boop");},520);ding();}

function party(n){n=n||26;var em=["\uD83C\uDF89","\uD83C\uDF2E","\uD83E\uDD69","\uD83C\uDF36\uFE0F","\uD83C\uDF8A","\uD83D\uDC3E","\u2B50","\uD83D\uDD25","\uD83C\uDF4B"];for(var i=0;i<n;i++){var c=document.createElement("div");c.className="confetti";c.textContent=em[Math.floor(Math.random()*em.length)];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*.6)+"s";document.body.appendChild(c);(function(cc){setTimeout(function(){cc.remove();},4200);})(c);}}
function bigFinale(){var fr=ridx,fc=cur;clearTimeout(window._ct);window._ct=setTimeout(function(){if(ridx===fr&&cur===fc){var scf=document.getElementById("scene");if(scf)scf.innerHTML=cheerScene();}},2300);ding();party(46);setTimeout(function(){party(38);ding();},450);setTimeout(function(){party(38);},950);setTimeout(function(){party(34);ding();},1500);var card=document.querySelector(".card");if(card){card.classList.remove("celebrate");void card.offsetWidth;card.classList.add("celebrate");}}


function groupsList(){var idx={};RECIPES.forEach(function(r,i){idx[r.id]=i;});return GROUPS.map(function(g){return [g[0],g[1].filter(function(id){return id in idx;}).map(function(id){return idx[id];})];}).filter(function(g){return g[1].length;});}
function startRecipe(i){ridx=i;cur=0;closeMenu();renderPicker();showView("cook");render();if(ING[RECIPES[i].id])openIng();}
function renderHome(){
 var gl=groupsList();
 document.getElementById("tiles").innerHTML=gl.map(function(g){var n=g[1].length;return "<button class='tile' data-g=\""+g[0]+"\"><span class='t-e'>"+(GEMO[g[0]]||"🍽️")+"</span><span class='t-n'>"+g[0]+"</span><span class='t-s'>"+n+(n===1?" recipe":" recipes")+"</span></button>";}).join("")+"<button class='tile all"+(gl.length%2?"":" wide")+"' data-g=''><span class='t-e'>🔍</span><span class='t-n'>All recipes</span><span class='t-s'>"+RECIPES.length+" recipes</span></button>";
 Array.prototype.forEach.call(document.querySelectorAll("#tiles .tile"),function(t){t.onclick=function(){var g=t.getAttribute("data-g");if(g){var gg=gl.filter(function(x){return x[0]===g;})[0];if(gg&&gg[1].length===1){startRecipe(gg[1][0]);return;}}openMenu(g||null);};});
 var rs=document.getElementById("resume"),R=RECIPES[ridx];
 if(hasSave&&R&&cur>0&&cur<R.steps.length-1){var nm=splitName(R.name);rs.innerHTML="<span class='r-e'>"+nm.e+"</span><span class='r-t'><span class='r-l'>Pick up where you left off</span><span class='r-n'>"+nm.t+"</span><span class='r-s'>Step "+(cur+1)+" of "+R.steps.length+"</span></span><span class='r-go'>Keep going ▶</span>";rs.hidden=false;}else{rs.hidden=true;}
 document.getElementById("homeScene").innerHTML=idleScene();
}
var HELLOS=["Hi! I'm Chef Kenny.","Hey there, chef!","Welcome back to the kitchen!","Chef Kenny, reporting for duty!"];
function showView(v){document.getElementById("home").classList.toggle("on",v==="home");document.getElementById("cook").classList.toggle("on",v==="cook");var want=v==="cook"?"#cook":"#home";if(location.hash!==want){try{history.pushState(null,"",want);}catch(e){location.hash=want;}}if(v==="home"){renderHome();document.getElementById("homeHi").textContent=HELLOS[Math.floor(Math.random()*HELLOS.length)];clearTimeout(window._ct);}window.scrollTo(0,0);}
window.addEventListener("popstate",function(){if(location.hash==="#cook"){showView("cook");render();}else{closeMenu();closeIng();showView("home");}});
document.getElementById("homeBtn").onclick=function(){showView("home");};
document.getElementById("goHomeH").onclick=function(){showView("home");};
document.getElementById("resume").onclick=function(){renderPicker();showView("cook");render();};
document.getElementById("homeScene").onclick=function(){document.getElementById("homeHi").textContent=BOOPS[Math.floor(Math.random()*BOOPS.length)];ding();var sc=document.getElementById("homeScene");sc.classList.remove("boop");void sc.offsetWidth;sc.classList.add("boop");setTimeout(function(){sc.classList.remove("boop");},520);};
document.getElementById("surprise").onclick=function(){ensureCtx();var pool=[];groupsList().forEach(function(g){if(g[0]!=="Sides & Salsas")pool=pool.concat(g[1]);});if(!pool.length)pool=RECIPES.map(function(r,i){return i;});var i=pool[Math.floor(Math.random()*pool.length)];if(pool.length>1&&i===ridx)i=pool[(pool.indexOf(i)+1)%pool.length];ding();startRecipe(i);};
(async function(){await load();renderPicker();if(location.hash==="#cook"){showView("cook");render();}else{try{history.replaceState(null,"","#home");}catch(e){}showView("home");}setInterval(function(){if(document.getElementById("timerBtn"))paintTimer();},1000);})();
</script>
